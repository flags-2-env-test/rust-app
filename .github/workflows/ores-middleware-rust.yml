name: ORES middleware Rust feature/OS stress

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "59 7 * * *"

permissions:
  contents: read

concurrency:
  group: ores-middleware-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ORES_MIDDLEWARE_SHA: d588e7bf890c337500641ed06d0b90f7b7a57748
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-middleware
          ref: ${{ env.ORES_MIDDLEWARE_SHA }}
          path: middleware
          persist-credentials: false
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Prove immutable upstream checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C middleware rev-parse HEAD)" = "$ORES_MIDDLEWARE_SHA"
          test -z "$(git -C middleware status --porcelain)"

      - name: Classify Rust formatting drift without hiding semantic tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p middleware/target/test-org/rust
          manifest=middleware/src/rust/Cargo.toml
          set +e
          cargo fmt --manifest-path "$manifest" -- --check > middleware/target/test-org/rust/rustfmt.txt 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "ORES_MIDDLEWARE_RUSTFMT_DRIFT=false" >> "$GITHUB_ENV"
          else
            echo "ORES_MIDDLEWARE_RUSTFMT_DRIFT=true" >> "$GITHUB_ENV"
            echo "::warning file=middleware/src/rust::rustfmt 1.95 reports formatting drift; semantic clippy/tests will still run and promotion will fail at the final style gate"
          fi

      - name: Compile every Rust feature projection with Clippy
        shell: bash
        run: |
          set -euo pipefail
          manifest=middleware/src/rust/Cargo.toml
          cargo clippy --manifest-path "$manifest" --no-default-features --all-targets -- -D warnings
          cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
          cargo clippy --manifest-path "$manifest" --all-features --all-targets -- -D warnings

      - name: Repeat portable-core tests with no framework features
        shell: bash
        run: |
          set -euo pipefail
          manifest=middleware/src/rust/Cargo.toml
          for iteration in 1 2 3; do
            echo "portable core iteration $iteration"
            cargo test --manifest-path "$manifest" --no-default-features --all-targets
          done

      - name: Repeat default Axum/compression tests
        shell: bash
        run: |
          set -euo pipefail
          manifest=middleware/src/rust/Cargo.toml
          for iteration in 1 2 3; do
            echo "default feature iteration $iteration"
            cargo test --manifest-path "$manifest" --all-targets
          done

      - name: Repeat all framework features and optimized build
        shell: bash
        run: |
          set -euo pipefail
          manifest=middleware/src/rust/Cargo.toml
          for iteration in 1 2 3; do
            echo "all-feature iteration $iteration"
            cargo test --manifest-path "$manifest" --all-features --all-targets
          done
          cargo test --manifest-path "$manifest" --release --all-features --all-targets

      - name: Validate runtime descriptor
        shell: bash
        run: |
          set -euo pipefail
          descriptor="$(cargo run --quiet --manifest-path middleware/src/rust/Cargo.toml --bin contractcheck)"
          printf '%s\n' "$descriptor" | jq -e '
            .contractVersion == "1.0.0" and
            .language == "rust" and
            (.capabilities | index("request-context")) != null and
            (.capabilities | index("deadline-timeout")) != null and
            (.capabilities | index("auth")) != null and
            (.frameworkAdapters | index("axum")) != null
          '

      - name: Retain Rust test-org evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flags-2-env-test-rust-middleware-${{ matrix.os }}-${{ github.run_id }}
          path: middleware/target/test-org/rust
          if-no-files-found: warn
          retention-days: 30

      - name: Prove tracked upstream source stayed immutable
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C middleware rev-parse HEAD)" = "$ORES_MIDDLEWARE_SHA"
          test -z "$(git -C middleware diff --name-only)"

      - name: Enforce Rust formatting reproducibility
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${ORES_MIDDLEWARE_RUSTFMT_DRIFT:-false}" = "true" ]; then
            echo "::error file=middleware/src/rust::rustfmt 1.95 reports tracked-source formatting drift; upstream formatting must be normalized before promotion"
            exit 1
          fi
