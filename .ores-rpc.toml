schemaVersion = "ores.rpc.config.v1"
repositoryMode = "client-only"
strict = true
flagsContract = ".cli-flags.toml"

[[env]]
name = "listenPort"
env = "PORT"
valueType = "integer"
required = false
secret = false
allowArgv = true

[[targets]]
name = "client"
role = "client"
roots = ["."]
rpcVersion = "v1"
transports = ["http"]
framing = "json"
